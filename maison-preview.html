<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PELAGIA – Онлайн магазин</title>
<meta name="description" content="Онлайн магазин за луксозна мода – чанти, обувки, аксесоари.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
/* ============ Токени ============ */
:root{
  --ink:#111; --paper:#fff; --mute:#8a8a8a; --line:#e6e4e0; --soft:#f3f1ec;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Jost",Arial,sans-serif;
  --type:"Courier Prime","Courier New",monospace;
  --pad:20px; --hdr:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* плейсхолдър за снимки */
.ph{background:var(--tone,#ddd);background-image:linear-gradient(135deg,rgba(255,255,255,.35),rgba(0,0,0,.06));position:relative}

/* ============ Announcement ============ */
.announce{background:#000;color:#fff;height:24px;display:flex;align-items:center;justify-content:center;position:relative;font-size:10px;font-weight:500;letter-spacing:.02em}
.announce a{text-decoration:underline}
.ann-arrow{position:absolute;color:#fff;font-size:14px;left:20px;top:0;line-height:24px}
.ann-arrow+.ann-arrow{left:44px}
.ann-close{position:absolute;right:20px;color:#fff;font-size:16px}

/* ============ Header ============ */
.site-header{position:sticky;top:0;z-index:50;transition:background .25s,color .25s}
.site-header.is-solid,.site-header.mega-open,.site-header.scrolled{background:#fff;color:var(--ink)}
.site-header.is-over:not(.mega-open):not(.scrolled){position:fixed;left:0;right:0;top:24px;color:#fff;background:transparent}
.hdr-row{height:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--pad)}
.logo{display:flex;flex-direction:column;line-height:1}
.logo-main{font-family:var(--serif);font-size:24px;letter-spacing:.02em}
.logo-sub{font-size:8px;letter-spacing:.35em;margin:3px 0 0 8px}
.main-nav{display:flex;gap:26px;text-transform:uppercase;font-size:10px;letter-spacing:.04em}
.main-nav a{padding:8px 0;opacity:.9}
.site-header.mega-open .main-nav a:not(.hover){opacity:.35}
.main-nav a.active{border-bottom:1px solid currentColor}
.hdr-icons{display:flex;gap:18px;justify-content:flex-end}
.hdr-icons button{position:relative;display:flex}
.cart-count{position:absolute;top:-6px;right:-8px;font-size:9px}

.mega-wrap{position:absolute;left:0;right:0;top:100%;background:#fff;color:var(--ink)}
.mega-inner{display:flex;gap:90px;padding:24px var(--pad) 40px;min-height:220px;border-top:1px solid var(--line)}
.mega-col h4{font-size:11px;font-weight:500;margin-bottom:22px}
.mega-col li{margin-bottom:12px;font-size:11px}
.mega-col a:hover{text-decoration:underline}
.mega-img{width:150px;height:180px;margin-left:auto}

/* ============ Hero ============ */
.hero{height:calc(100vh - 24px);min-height:520px;display:flex;align-items:flex-end;justify-content:center;color:#fff}
.hero-copy{text-align:center;padding-bottom:40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:22px}
.btn{padding:11px 34px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.btn-dark{background:rgba(40,40,40,.85);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-dark:hover{background:#000}
.hero-pause{position:absolute;right:20px;bottom:30px;width:26px;height:26px;border:1px solid #fff;border-radius:50%;display:flex;gap:3px;align-items:center;justify-content:center}
.hero-pause i{width:2px;height:9px;background:#fff}
.hero-pause.paused i:last-child{display:none}
.hero{position:relative}

/* ============ Highlights ============ */
.highlights{padding:26px 0 0;text-align:center}
.sec-title{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.01em}
.sec-title.caps{text-transform:uppercase;font-size:17px}
.tabs{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0 24px;font-family:var(--serif);font-style:italic;font-size:14px}
.tabs button{color:var(--mute)}.tabs button.on{color:var(--ink)}
.tabs span{width:1px;height:12px;background:var(--ink)}
.hl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.hl-tile{aspect-ratio:3/4;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-family:var(--serif);font-size:16px;padding-bottom:12px}

/* ============ Collection ============ */
.collection-wrap{padding:36px 0 0;text-align:center}
.collection{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:2px;margin-top:22px;text-align:left}
.col-hero{grid-row:1/3;min-height:520px}
.col-card{background:var(--soft);display:flex;flex-direction:column;padding:10px 12px;min-height:260px}
.col-card small{color:var(--mute);font-size:10px}
.col-card .ph{flex:1;margin:10px auto;width:55%;min-height:110px;background-color:transparent;background-image:none;border:1px dashed #cfc9be}
.col-card p{display:flex;justify-content:space-between;font-size:10px}
.collection{grid-template-columns:2fr 1fr 1fr}
.dots{display:flex;align-items:center;justify-content:center;gap:0;margin:26px auto;width:min(620px,80%)}
.dots i{flex:1;height:1px;background:var(--line)}.dots b{width:3px;height:3px;border-radius:50%;background:var(--ink);margin:0 4px}

/* ============ Split ============ */
.split{display:grid;grid-template-columns:1fr 1fr;align-items:center;min-height:620px}
.split-text{text-align:center;display:flex;flex-direction:column;gap:30px;align-items:center}
.split-text h2{font-family:var(--serif);font-weight:500;font-size:46px;line-height:1.05}
.split-img{height:100%;min-height:620px}
.link-sm{font-size:10px;color:#445;text-decoration:none}
.link-sm:hover{text-decoration:underline}

/* ============ THE EDIT ============ */
.edit{background:#000;color:#fff;text-align:center;padding:44px 20px 38px;margin-top:26px}
.edit h2{font-family:var(--type);font-weight:700;font-size:clamp(56px,9vw,104px);letter-spacing:-.02em;line-height:1}
.edit p{font-family:var(--serif);font-size:15px;margin:10px 0 22px}
.edit a{font-size:11px}

/* ============ Footer ============ */
.site-footer{padding:0 var(--pad)}
.foot-top{text-align:right;padding:34px 0 40px}
.to-top{font-size:11px;text-decoration:underline}
.foot-news{display:grid;grid-template-columns:1fr auto;gap:10px 40px;align-items:start;padding-bottom:70px;color:#223}
.foot-news input{grid-column:1;width:min(320px,100%);border:0;border-bottom:1px solid var(--ink);padding:10px 0;font:inherit;outline-offset:4px;background:none}
.country{grid-row:1/3;grid-column:2;text-align:left}.country small{display:block;color:var(--mute);margin-top:8px}
.foot-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;border-top:1px solid var(--line);padding:36px 0 60px}
.foot-cols h5{font-size:10px;font-weight:500;text-transform:uppercase;margin-bottom:22px}
.foot-cols li{margin-bottom:16px;font-size:11px}
.foot-cols a:hover{text-decoration:underline}
.socials{display:flex;gap:10px}.socials a{font-size:10px;border:1px solid var(--ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.foot-bottom{background:#000;color:#fff;margin:0 calc(var(--pad)*-1);padding:14px;text-align:center;font-size:9px;font-weight:500}

/* ============ Каталог ============ */
.catalog{display:grid;grid-template-columns:260px 1fr;padding:30px var(--pad) 60px;gap:20px;min-height:80vh}
.side-nav{position:sticky;top:calc(var(--hdr) + 20px);align-self:start}
.side-nav h2{font-size:11px;font-weight:500;margin-bottom:22px}
.side-nav li{margin-bottom:16px}
.side-nav button{font-size:11px;text-align:left}
.side-nav button.on{text-decoration:underline}
.product-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 2px;align-content:start}
.p-card{position:relative;display:flex;flex-direction:column}
.p-img{aspect-ratio:3/4;display:block;background-color:var(--tone)}
.p-meta{padding:8px 4px 4px;display:flex;flex-direction:column;gap:4px;font-size:10px}
.p-meta h3{font-weight:400}.p-meta span{color:var(--mute)}
.p-add{margin:4px;padding:9px;border:1px solid var(--ink);font-size:10px;opacity:0;transition:opacity .2s}
.p-card:hover .p-add,.p-add:focus-visible{opacity:1}
.empty{color:var(--mute);padding:20px 0}

/* ============ Количка ============ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
.scrim.open{opacity:1;pointer-events:auto}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:100;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.cart-drawer.open{transform:none}
.cd-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.cd-head h3{font-family:var(--serif);font-weight:500;font-size:20px}.cd-head button{font-size:22px}
.cd-items{flex:1;overflow:auto;padding:10px 20px}
.cd-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cd-item .ph{aspect-ratio:3/4}.cd-item small{color:var(--mute)}
.cd-foot{padding:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.cd-total{display:flex;justify-content:space-between;font-size:13px}

/* ============ Responsive ============ */
@media (max-width:1000px){
  .main-nav{display:none}.hdr-row{grid-template-columns:1fr auto}
  .hl-grid{grid-template-columns:1fr 1fr}
  .collection{grid-template-columns:1fr 1fr}.col-hero{grid-column:1/3;grid-row:auto;min-height:320px}
  .split,.split.reverse{grid-template-columns:1fr}.split-img{min-height:380px}.split.reverse .split-img{order:-1}.split-text{padding:50px 0}
  .catalog{grid-template-columns:1fr}.side-nav{position:static}.side-nav ul{display:flex;gap:16px;overflow-x:auto}
  .product-grid{grid-template-columns:repeat(2,1fr)}.p-add{opacity:1}
  .foot-cols{grid-template-columns:1fr 1fr}.foot-news{grid-template-columns:1fr}.country{grid-row:auto;grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

[hidden]{display:none!important}
</style>
</head>

<script>
(function () {
  const S = window.SHOP;
  const $ = (s, r = document) => r.querySelector(s);
  const eur = n => new Intl.NumberFormat("bg-BG", { style: "currency", currency: "EUR", minimumFractionDigits: 0 }).format(n);
  let page = "home";

  /* ---------- Header ---------- */
  function megaPanel(id) {
    const cols = S.mega[id] || [];
    return `<div class="mega" data-panel="${id}" hidden>
      <div class="mega-inner">
        ${cols.map(c => `<div class="mega-col">${c[0] ? `<h4>${c[0]}</h4>` : ""}<ul>${c[1].map(l => `<li><a href="#" data-stub>${l}</a></li>`).join("")}</ul></div>`).join("")}
        <div class="mega-img ph" style="--tone:#d8c6c0"></div>
      </div></div>`;
  }
  const header = `
  <div class="announce"><button class="ann-arrow" aria-label="Назад">‹</button><button class="ann-arrow" aria-label="Напред">›</button>
    <p>${S.announce.text} &nbsp;|&nbsp; <a href="${S.announce.href}">${S.announce.link}</a></p>
    <button class="ann-close" aria-label="Затвори">×</button></div>
  <header class="site-header is-over" id="header">
    <div class="hdr-row">
      <a class="logo" href="#home"><span class="logo-main">${S.brand}</span><span class="logo-sub">${S.tagline}</span></a>
      <nav class="main-nav" aria-label="Главно меню">
        ${S.nav.map(n => `<a href="${n.href}" data-menu="${n.id}" class="${page === n.id ? "active" : ""}">${n.label}</a>`).join("")}
      </nav>
      <div class="hdr-icons">
        <button aria-label="Търсене">${ico("search")}</button>
        <button aria-label="Контакти">${ico("phone")}</button>
        <button aria-label="Любими">${ico("heart")}</button>
        <button aria-label="Количка" id="cartBtn">${ico("bag")}<span class="cart-count" id="cartCount"></span></button>
      </div>
    </div>
    <div class="mega-wrap">${S.nav.map(n => megaPanel(n.id)).join("")}</div>
  </header>`;

  /* ---------- Footer ---------- */
  const footer = `
  <footer class="site-footer">
    <div class="foot-top"><a href="#" data-stub class="to-top" id="toTop">Към началото ↑</a></div>
    <div class="foot-news"><label for="nl">Абонирай се за бюлетина</label>

      <div><h5>Последвай ни</h5><div class="socials"><a href="#" data-stub>IG</a><a href="#" data-stub>FB</a><a href="#" data-stub>TT</a><a href="#" data-stub>X</a></div>
      <h5 style="margin-top:28px">Изтегли приложението</h5></div>
    </div>
    <div class="foot-bottom">Powered by Hackera Online &nbsp; © 2026 ${S.brand}. Всички права запазени.</div>
  </footer>
  <aside class="cart-drawer" id="drawer" aria-hidden="true">
    <div class="cd-head"><h3>Количка</h3><button id="cdClose" aria-label="Затвори">×</button></div>
    <div class="cd-items" id="cdItems"></div>
    <div class="cd-foot"><div class="cd-total"><span>Общо</span><strong id="cdTotal">0 €</strong></div><button class="btn btn-dark">Към поръчката</button></div>
  </aside><div class="scrim" id="scrim"></div>`;

  function ico(n) {
    const p = {
      search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
      phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/>',
      heart: '<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/>',
      bag: '<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/>'
    };
    return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.3">${p[n]}</svg>`;
  }

  document.body.insertAdjacentHTML("afterbegin", header);
  document.body.insertAdjacentHTML("beforeend", footer);

  /* ---------- Mega menu ---------- */
  const hdr = $("#header");
  document.addEventListener("click", e => { const a = e.target.closest("a[data-stub], a[href=\"#\"]"); if (a) e.preventDefault(); });
  let closeT;
  document.querySelectorAll(".main-nav a").forEach(a => {
    a.addEventListener("mouseenter", () => { clearTimeout(closeT); openMega(a.dataset.menu, a); });
  });
  hdr.addEventListener("mouseleave", () => { closeT = setTimeout(closeMega, 120); });
  function openMega(id, link) {
    document.querySelectorAll(".mega").forEach(m => (m.hidden = m.dataset.panel !== id));
    document.querySelectorAll(".main-nav a").forEach(x => x.classList.toggle("hover", x === link));
    hdr.classList.add("mega-open");
  }
  function closeMega() {
    document.querySelectorAll(".mega").forEach(m => (m.hidden = true));
    document.querySelectorAll(".main-nav a").forEach(x => x.classList.remove("hover"));
    hdr.classList.remove("mega-open");
  }
  addEventListener("scroll", () => hdr.classList.toggle("scrolled", scrollY > 40), { passive: true });
  $(".ann-close").onclick = () => $(".announce").remove();
  $("#toTop").onclick = e => { e.preventDefault(); scrollTo({ top: 0, behavior: "smooth" }); };

  /* ---------- Cart (localStorage) ---------- */
  const load = () => { try { return JSON.parse(localStorage.getItem("cart")) || []; } catch (e) { return []; } };
  const save = c => { try { localStorage.setItem("cart", JSON.stringify(c)); } catch (e) {} };
  let cart = load();
  function renderCart() {
    const n = cart.reduce((a, i) => a + i.qty, 0);
    $("#cartCount").textContent = n || "";
    $("#cdItems").innerHTML = cart.length ? cart.map(i => `
      <div class="cd-item"><div class="ph" style="--tone:${i.tone}"></div>
      <div><p>${i.name}</p><small>${eur(i.price)} × ${i.qty}</small></div>
      <button data-rm="${i.id}" aria-label="Премахни">×</button></div>`).join("") : "<p class='empty'>Количката е празна. Добави продукт от каталога.</p>";
    $("#cdTotal").textContent = eur(cart.reduce((a, i) => a + i.price * i.qty, 0));
  }
  window.addToCart = id => {
    const p = S.products.find(x => x.id === id); if (!p) return;
    const ex = cart.find(i => i.id === id);
    ex ? ex.qty++ : cart.push({ ...p, qty: 1 });
    save(cart); renderCart(); toggleDrawer(true);
  };
  function toggleDrawer(open) {
    $("#drawer").classList.toggle("open", open); $("#scrim").classList.toggle("open", open);
    $("#drawer").setAttribute("aria-hidden", String(!open));
  }
  $("#cartBtn").onclick = () => toggleDrawer(true);
  $("#cdClose").onclick = $("#scrim").onclick = () => toggleDrawer(false);
  $("#cdItems").addEventListener("click", e => {
    const id = e.target.dataset.rm; if (!id) return;
    cart = cart.filter(i => i.id !== +id); save(cart); renderCart();
  });
  renderCart();

  /* ---------- Home ---------- */
  const hl = $("#highlights");
  if (hl) {
    const draw = k => (hl.querySelector(".hl-grid").innerHTML = S.highlights[k].map(h => `<a href="#bags" class="hl-tile ph" style="--tone:${h[1]}"><span>${h[0]}</span></a>`).join(""));
    draw("women");
    hl.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      hl.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x === b)); draw(b.dataset.tab);
    });
  }
  const col = $("#collection");
  if (col) col.innerHTML = `<div class="col-hero ph" style="--tone:#d6cfc6"></div>` + S.collection.map(c => `
    <a href="#bags" class="col-card"><small>${c.tag}</small><div class="ph" style="--tone:${c.tone}"></div>
    <p><span>${c.name}</span><span>${eur(c.price)}</span></p></a>`).join("");

  const pause = $("#heroPause");
  if (pause) pause.onclick = () => pause.classList.toggle("paused");

  /* ---------- Category page ---------- */
  const grid = $("#productGrid");
  if (grid) {
    const side = $("#sideNav");
    let active = "Виж всички";
    side.innerHTML = `<h2>Чанти</h2><ul>${S.bagCategories.map(c => `<li><button data-c="${c}" class="${c === active ? "on" : ""}">${c}</button></li>`).join("")}</ul>`;
    const drawGrid = () => {
      const list = S.products.filter(p => active === "Виж всички" || p.cat === active);
      grid.innerHTML = list.map(p => `
        <article class="p-card"><a href="#" data-stub class="p-img ph" style="--tone:${p.tone}" aria-label="${p.name}"></a>
        <div class="p-meta"><h3>${p.name}</h3><span>${eur(p.price)}</span></div>
        <button class="p-add" onclick="addToCart(${p.id})">Добави в количката</button></article>`).join("") || "<p class='empty'>Няма продукти в тази категория.</p>";
    };
    side.addEventListener("click", e => {
      const c = e.target.dataset.c; if (!c) return; active = c;
      side.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.c === c)); drawGrid();
    });
    drawGrid();
  }

  /* ---------- Router (hash) ---------- */
  function route() {
    page = (location.hash === "#bags") ? "bags" : "home";
    document.querySelectorAll("[data-view]").forEach(v => (v.hidden = v.dataset.view !== page));
    hdr.classList.toggle("is-over", page === "home");
    hdr.classList.toggle("is-solid", page !== "home");
    document.querySelectorAll(".main-nav a").forEach(a => a.classList.toggle("active", a.dataset.menu === page));
    closeMega();
    scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
