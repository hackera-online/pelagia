<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="home">

<main>

  </section>

  <section class="edit">

    <p>Сценично и вечерно облекло &nbsp;•&nbsp; Авторски дизайн &nbsp;•&nbsp; Ръчно рисувани платове &nbsp;•&nbsp; Авторски бижута и аксесоари</p>
    <a href="#">Открий колекцията</a>

<script src="assets/js/data.js"></script>
